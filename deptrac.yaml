# Deptrac: module boundaries enforced by static analysis
#
# Deptrac reads every class under `paths`, sorts each one into a layer using
# the `collectors`, then checks every dependency (use statements, type hints,
# `new`, static calls, attributes) against the `ruleset`. A dependency from
# layer A to layer B is only allowed if B is listed under A.
#
# Run it with `make deptrac`. It runs with --fail-on-uncovered, so a
# dependency on a class that belongs to no layer fails the build instead of
# slipping through unchecked.
#
# How a module plugs in (see modules/README.md):
#   1. Add two layers per module: `{Name}` for internals and
#      `{Name}Contracts` for its public Contracts/ folder.
#   2. Add a ruleset entry for each. Internals may use Core, Framework, their
#      own contracts and the contracts of declared dependencies. Contracts may
#      use Framework only, so the public surface stays thin.
#   3. Never list another module's internals layer. That is the boundary.

deptrac:
    paths:
        - ./app
        - ./modules

    # Module tests are Pest files, not part of any layer. They exercise a
    # module from the outside and are checked by the test run instead.
    exclude_files:
        - '#.*/modules/[^/]+/Tests/.*#'

    layers:
        # Core: organisations, users, roles, teams, players, feature flags, the
        # module registry and the audit log. Always installed, always on.
        #
        # Layers are collected by namespace, not directory. A directory regex such
        # as `app/.*` is matched against absolute paths, so inside a container
        # mounted at /app it would also swallow /app/modules/... into Core.
        - name: Core
          collectors:
              - type: classLike
                value: ^App\\.*

        # Framework: vendor code the app is built on. Listing namespaces here,
        # rather than ignoring vendor entirely, means a new package has to be
        # classified on purpose before anything can depend on it.
        - name: Framework
          collectors:
              - type: classLike
                value: ^(Illuminate|Laravel|Inertia|Symfony|Carbon|Psr)\\.*

        # Fixtures: the reference module. Every module gets this pair.
        #
        # FixturesContracts is the public surface: Contracts/ (FixtureLookup,
        # FixtureData, events). Fixtures is everything else and is private.
        # The negative lookahead keeps Contracts out of the internals layer.
        - name: Fixtures
          collectors:
              - type: classLike
                value: ^Modules\\Fixtures\\(?!Contracts\\).*
        - name: FixturesContracts
          collectors:
              - type: classLike
                value: ^Modules\\Fixtures\\Contracts\\.*

        # Availability: hard-depends on Fixtures, so it may use
        # FixturesContracts. It may never use Fixtures' internals layer.
        - name: Availability
          collectors:
              - type: classLike
                value: ^Modules\\Availability\\(?!Contracts\\).*
        - name: AvailabilityContracts
          collectors:
              - type: classLike
                value: ^Modules\\Availability\\Contracts\\.*

        # MatchReports: also hard-depends on Fixtures. It sits beside
        # Availability; neither may see the other.
        - name: MatchReports
          collectors:
              - type: classLike
                value: ^Modules\\MatchReports\\(?!Contracts\\).*
        - name: MatchReportsContracts
          collectors:
              - type: classLike
                value: ^Modules\\MatchReports\\Contracts\\.*

        # Subscriptions: no dependencies. Its Contracts publish the
        # PaymentOverdue event that Messaging listens to.
        - name: Subscriptions
          collectors:
              - type: classLike
                value: ^Modules\\Subscriptions\\(?!Contracts\\).*
        - name: SubscriptionsContracts
          collectors:
              - type: classLike
                value: ^Modules\\Subscriptions\\Contracts\\.*

        # KitShop: soft-depends on Subscriptions, yet has no Subscriptions
        # layer in its ruleset. The membership check goes through Core's
        # MembershipStatus capability, so there is nothing to allow.
        - name: KitShop
          collectors:
              - type: classLike
                value: ^Modules\\KitShop\\(?!Contracts\\).*
        - name: KitShopContracts
          collectors:
              - type: classLike
                value: ^Modules\\KitShop\\Contracts\\.*

        - name: Compliance
          collectors:
              - type: classLike
                value: ^Modules\\Compliance\\(?!Contracts\\).*
        - name: ComplianceContracts
          collectors:
              - type: classLike
                value: ^Modules\\Compliance\\Contracts\\.*

        # Messaging: soft-depends on Fixtures and Subscriptions through their
        # public events only.
        - name: Messaging
          collectors:
              - type: classLike
                value: ^Modules\\Messaging\\(?!Contracts\\).*
        - name: MessagingContracts
          collectors:
              - type: classLike
                value: ^Modules\\Messaging\\Contracts\\.*

    ruleset:
        # Core depends on the framework and nothing else. It never names a module
        # layer, which is what lets any module be deleted without touching Core.
        Core:
            - Framework

        # Framework sits outside `paths`, so it is never analysed as a source.
        Framework: ~

        # A module's internals may use Core, the framework and its own
        # contracts. Fixtures has no dependencies, so no other module's
        # contracts appear here.
        Fixtures:
            - Core
            - Framework
            - FixturesContracts

        # Contracts stay thin: framework types only, never the module's own
        # internals (a DTO must not hand out a model) and never Core.
        FixturesContracts:
            - Framework

        # A dependent module lists its dependency's *contracts* layer only.
        # Adding `Fixtures` here instead would compile, run, and defeat the
        # whole design: this is the line that makes the boundary real.
        Availability:
            - Core
            - Framework
            - AvailabilityContracts
            - FixturesContracts

        AvailabilityContracts:
            - Framework

        MatchReports:
            - Core
            - Framework
            - MatchReportsContracts
            - FixturesContracts

        MatchReportsContracts:
            - Framework

        Subscriptions:
            - Core
            - Framework
            - SubscriptionsContracts

        SubscriptionsContracts:
            - Framework

        # No SubscriptionsContracts here: a soft dependency needs no edge
        KitShop:
            - Core
            - Framework
            - KitShopContracts

        KitShopContracts:
            - Framework

        Compliance:
            - Core
            - Framework
            - ComplianceContracts

        ComplianceContracts:
            - Framework

        # Soft dependency through events: unlike KitShop's capability, here the
        # module listens to other modules' published events, so their
        # Contracts layers are allowed. Their internals never are.
        Messaging:
            - Core
            - Framework
            - MessagingContracts
            - FixturesContracts
            - SubscriptionsContracts

        MessagingContracts:
            - Framework

    # Module graph: `make graph` renders docs/modules.png with the Graphviz
    # formatter. Each arrow is a real dependency found in the code, so the
    # picture cannot drift from what the ruleset enforces.
    #
    # Framework is hidden: everything depends on it, and drawing those edges
    # buries the ones that matter. Each module's two layers are grouped so it
    # reads as one box, with its Contracts beside its internals. A new module
    # adds its pair here alongside its layers and ruleset entries.
    formatters:
        graphviz:
            hidden_layers:
                - Framework
            groups:
                Core:
                    - Core
                Fixtures:
                    - Fixtures
                    - FixturesContracts
                Availability:
                    - Availability
                    - AvailabilityContracts
                MatchReports:
                    - MatchReports
                    - MatchReportsContracts
                Subscriptions:
                    - Subscriptions
                    - SubscriptionsContracts
                KitShop:
                    - KitShop
                    - KitShopContracts
                Compliance:
                    - Compliance
                    - ComplianceContracts
                Messaging:
                    - Messaging
                    - MessagingContracts
