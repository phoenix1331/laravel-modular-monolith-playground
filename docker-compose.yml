services:
    app:
        build:
            context: .
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        ports:
            - '${APP_PORT:-8000}:8000'
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/app
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fs', 'http://localhost:8000/up']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s

    # Browser tests, run with `make e2e`. Only started on demand (profile).
    # Shares the app container's network, so localhost:8000 (the app) and
    # localhost:5173 (Vite) resolve exactly as they do in a developer's
    # browser. The image tag must match @playwright/test in package.json.
    playwright:
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        profiles: [e2e]
        network_mode: service:app
        user: '${UID:-1000}:${GID:-1000}'
        working_dir: /app
        environment:
            HOME: /tmp
        volumes:
            - .:/app
        depends_on:
            app:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_DATABASE: ${DB_DATABASE:-modular_monolith}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-p${DB_PASSWORD:-secret}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
