# CI: every quality gate from `make check`, plus the uninstall check for each
# module that can be removed on its own.
#
# The steps call the same Makefile targets used locally. Locally they run in
# the app container; in the gates and uninstall jobs `EXEC=` runs them
# straight on the runner, so a gate is defined once and CI cannot drift from
# what developers run.
#
# The e2e job boots the real Docker stack, seeds the four clubs and checks
# each admin's menu in a browser. There, artisan runs in the app container,
# as it does locally.
#
# A crossed module boundary fails the build three ways: Deptrac (PHP layers),
# Pest arch tests (source scans) and ESLint (eslint-plugin-boundaries).

name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gates:
        name: Quality gates
        runs-on: ubuntu-latest
        # PHP and Node are on the runner: run the Makefile targets directly
        env:
            EXEC: ''
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, zip, pcntl, bcmath, pdo_sqlite
                  coverage: none

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Install npm dependencies
              run: npm ci

            - name: Prepare the application
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # Builds the assets the Inertia tests render with, and generates
            # the Wayfinder route helpers (gitignored) that the type check,
            # Oxlint and ESLint resolve imports through
            - name: Build frontend
              run: npm run build

            - name: Pint
              run: make lint-check

            - name: Oxlint and formatting
              run: make lint-ts

            - name: Frontend boundaries (ESLint)
              run: make lint-js

            - name: PHPStan
              run: make stan

            - name: Deptrac
              run: make deptrac

            - name: Type check
              run: make types

            - name: Vitest
              run: make test-js

            - name: Pest
              run: make test

    e2e:
        name: Browser tests
        needs: gates
        runs-on: ubuntu-latest
        # Unlike the other jobs, artisan runs inside the app container here,
        # where the `mysql` host resolves. -T: there is no TTY in CI
        env:
            EXEC: docker compose exec -T app
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, zip, pcntl, bcmath
                  coverage: none

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            # Installed on the runner so the app container's entrypoint finds
            # them and starts straight away
            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist
                  npm ci

            # The container runs as the runner's user so it can write to the
            # checkout, as it runs as the developer's user locally
            - name: Configure the stack
              run: |
                  cp .env.example .env
                  sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
                  printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env

            - name: Start the stack (FrankenPHP, MySQL, Vite)
              run: docker compose up -d --build --wait

            - name: Seed the clubs
              run: make fresh

            - name: Playwright
              run: make e2e

            - name: Upload the report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            - name: App logs
              if: failure()
              run: docker compose logs app

    uninstall:
        name: Uninstall ${{ matrix.module }}
        needs: gates
        runs-on: ubuntu-latest
        env:
            EXEC: ''
        strategy:
            fail-fast: false
            # Fixtures is absent on purpose: Availability and MatchReports
            # hard-depend on it, so it cannot be removed on its own
            matrix:
                module:
                    - Availability
                    - MatchReports
                    - Subscriptions
                    - KitShop
                    - Compliance
                    - Messaging
                    # make:module adds new modules above this line
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, zip, pcntl, bcmath, pdo_sqlite
                  coverage: none

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist
                  npm ci

            - name: Prepare the application
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  npm run build

            - name: Delete ${{ matrix.module }} and run every gate
              run: make uninstall-check MODULE=${{ matrix.module }}
